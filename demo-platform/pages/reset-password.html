<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset Password · TurfOS</title><link rel="stylesheet" href="../css/reset-password.css?v=20261026-interface-208"><link rel="icon" href="../assets/images/icon-192.png"><link rel="stylesheet" href="../css/buttons.css?v=20261026-interface-208"></head>
<body><main class="recovery-card"><a class="recovery-brand" href="../index.html"><img src="../assets/images/turfos-logo.png" alt="TurfOS"></a><span class="eyebrow">Account Recovery</span><h1>Reset Your Password</h1><p id="recovery-intro">Enter your account email and we’ll send you a secure reset link.</p>
<form id="request-form"><label for="account-type">Account Type</label><select id="account-type"><option value="business">Business Owner or Employee</option><option value="customer">Customer</option></select><label for="recovery-email">Email Address</label><input id="recovery-email" type="email" autocomplete="email" required placeholder="you@example.com"><button class="primary" type="submit">Send Reset Link</button></form>
<form id="reset-form" hidden><label for="new-password">New Password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="At least 8 characters"><label for="confirm-password">Confirm New Password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button class="primary" type="submit">Save New Password</button></form>
<p id="recovery-status" role="status" aria-live="polite" hidden></p><a class="back-link" href="../index.html">Back to Sign In</a><p class="recovery-note">Reset links expire after 30 minutes and can only be used once.</p></main><script src="../js/reset-password.js?v=20261026-interface-208"></script></body></html>
